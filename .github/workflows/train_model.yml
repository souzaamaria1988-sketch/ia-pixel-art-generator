name: 🧠 Treinar VAE Pixel Art

on:
  workflow_dispatch:
    inputs:
      epochs:
        description: 'Epocas'
        required: false
        type: choice
        default: '5000'
        options: ['2500','5000','10000','15000']
      batch_size:
        description: 'Batch size'
        required: false
        type: choice
        default: '64'
        options: ['32','64','128']
      resume:
        description: 'Retomar do checkpoint'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  train:
    name: 🧠 Treinar VAE
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      EPOCHS: ${{ inputs.epochs }}
      BATCH_SIZE: ${{ inputs.batch_size }}
      RESUME: ${{ inputs.resume }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 📦 Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: 📊 Info
        run: |
          echo "CPU: $(nproc)"
          free -h
      - name: 🧠 Treinar VAE
        run: |
          mkdir -p models/checkpoints models/samples pixel_art_input
          RESUME_FLAG=""
          if [ "$RESUME" = "true" ]; then RESUME_FLAG="--resume"; fi
          python train.py --epochs $EPOCHS --batch-size $BATCH_SIZE $RESUME_FLAG
      - name: 📋 Verificar
        run: |
          ls -lh models/checkpoints/
          cat models/manifest.json
          du -sh models/
      - name: 💾 Commit e Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models/
          if ! git diff --cached --quiet; then
            git commit -m "🧠 Treinar VAE: $EPOCHS epocas"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push
          fi
      - name: 📤 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vae-model-${{ github.run_number }}
          path: models/
          retention-days: 90
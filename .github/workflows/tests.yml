name: 🧪 Testar Pixel Art VAE

on:
  workflow_dispatch:
  push:
    paths:
      - 'train.py'
      - 'pixel_art_generator.py'
      - 'config.py'
      - 'tests.py'

permissions:
  contents: read

jobs:
  test:
    name: 🧪 Executar 10 testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 📦 Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: 🧪 pytest
        run: |
          mkdir -p models/checkpoints pixel_art_output
          python -m pytest tests.py -v --tb=short
